name: release

# This file lives at `main/.github/workflows/release.yml` because `main/` *is*
# the repository root: the GitHub repository whose tree this checkout mirrors
# (XhaStudio/Akkhara-Programming-Language) has Cargo.toml, .cargo/, scripts/,
# src/ (the built-in libraries live under src/stdlib/) and tests/ at its top
# level. Every step therefore already runs
# in the directory that holds Cargo.toml, and no `working-directory` is
# needed.
#
# No Linux system packages are installed: the wayland/xkbcommon/EGL/X11 crates
# in this dependency tree all load their libraries at run time. `cargo tree
# --target x86_64-unknown-linux-gnu -e features` shows `wayland-sys feature
# "dlopen"` (its build.rs returns before `pkg_config::probe`) and `x11rb
# feature "dl-libxcb"`, xkbcommon-dl and glutin_egl_sys generate bindings
# without pkg-config. `rfd` uses its `xdg-portal` backend, not GTK, so no
# libgtk-3-dev is required. Vendored OpenSSL builds with the runner's own
# perl/make/gcc.

# Triggers whenever you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf akk-${{ matrix.target }}.tar.gz akk
          mv akk-${{ matrix.target }}.tar.gz "$GITHUB_WORKSPACE/"

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path akk.exe -DestinationPath akk-${{ matrix.target }}.zip
          Move-Item akk-${{ matrix.target }}.zip "$env:GITHUB_WORKSPACE/"

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: akk-${{ matrix.target }}
          path: akk-${{ matrix.target }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: akk-${{ matrix.target }}
          path: akk-${{ matrix.target }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
