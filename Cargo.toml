[package]
name = "akkhara"
version = "0.4.12"
edition = "2021"

[[bin]]
name = "akk"
path = "src/main.rs"

[dependencies]
rand = "0.8"
ureq = { version = "2.9", default-features = false, features = ["native-tls", "gzip"] }
native-tls = { version = "0.2", features = ["vendored"] }
crossterm = "0.27"

# The App GUI library (libraries/App/main.rs). eframe's glow (OpenGL)
# renderer is used instead of the default wgpu one: a smaller dependency
# tree that works on older GPUs. `default_fonts` gives the Latin UI its
# baseline font, on top of which a system Myanmar font is loaded at
# runtime.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }

# App runs its GUI event loop on a background thread (the interpreter thread
# stays inside App.run), and winit only allows that when it is asked
# explicitly -- see the event-loop hook in libraries/App/main.rs. The
# version must stay compatible with the one eframe builds against, or the
# EventLoopBuilder types would not match.
winit = "0.30"

# Native file-open dialog for App.pick_file().
rfd = "0.17"

# App.image() decoding, limited to the formats an App program is likely to
# point at.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "gif",
    "webp",
] }

[profile.release]
opt-level = 3
# `akk` is a tree-walking interpreter, so nearly all of a program's time is
# spent in the interpreter loop, inlining across the lexer/parser/interpreter
# module boundaries. Fat LTO with one codegen unit lets the whole crate be
# optimized as a single body of code. `strip` keeps the executable small,
# which also matters on every run: the OS loads the binary before the first
# statement executes. (Measured effect and how to reproduce: benchmarks/.)
lto = "fat"
codegen-units = 1
strip = true
